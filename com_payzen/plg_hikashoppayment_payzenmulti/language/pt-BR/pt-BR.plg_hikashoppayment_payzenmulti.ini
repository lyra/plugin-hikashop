PAYZENMULTI_MULTI_OPTIONS_DESC1="Clique no botão Adicionar para configurar uma ou mais opções de pagamento.<br /><b>Rótulo: </b>Texto descrevendo a opção de pagamento múltiplo.<br /><b>Valor min.: </b>Valor mínimo para propor a opção.<br /><b>Valor max.: </b>Valor máximo para propor a opção.<br /><b>Contrato: </b>ID do contrato para usar com a opção (deixar vazio de preferência).<br /><b>Contagem: </b>Quantidade total de pagamentos.<br /><b>Período: </b>Prazo entre dois pagamentos (em dias).<br /><b>1º pagamento: </b>Valor do primeiro pagamento em percentagem do total. Se vazio, todos os pagamentos terão o mesmo valor."
PAYZENMULTI_MULTI_OPTIONS_DESC2="Clique no botão Adicionar para configurar uma ou mais opções de pagamento.<br /><b>Rótulo: </b>Texto descrevendo a opção de pagamento múltiplo.<br /><b>Valor min.: </b>Valor mínimo para propor a opção.<br /><b>Valor max.: </b>Valor máximo para propor a opção.<br /><b>Contagem: </b>Quantidade total de pagamentos.<br /><b>Período: </b>Prazo entre dois pagamentos (em dias).<br /><b>1º pagamento: </b>Valor do primeiro pagamento em percentagem do total. Se vazio, todos os pagamentos terão o mesmo valor."
